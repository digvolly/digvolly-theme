<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="geomPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <circle cx="20" cy="20" r="4" fill="rgba(255,255,255,0.4)"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <rect width="600" height="400" fill="url(#geomPattern)"/>
  <!-- Central Badge -->
  <g transform="translate(100, 130)">
    <rect width="400" height="140" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="200" y="55" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEOMETRIC REPEAT PACK</text>
    <text x="200" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93C5FD" text-anchor="middle">24 Seamless Vector Patterns &bull; AI, EPS, SVG</text>
    <rect x="140" y="104" width="120" height="22" rx="11" fill="#3B82F6"/>
    <text x="200" y="119" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIGITAL VECTOR</text>
  </g>
</svg>
