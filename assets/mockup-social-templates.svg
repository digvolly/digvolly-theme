<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg6)"/>
  <!-- Phone Frame & Social Post Grid -->
  <g transform="translate(140, 30)">
    <!-- Back Square Card -->
    <rect x="190" y="30" width="130" height="130" rx="10" fill="#FFFFFF" opacity="0.4" transform="rotate(10 255 95)"/>
    <!-- Phone Mockup Frame -->
    <rect x="80" y="20" width="140" height="230" rx="24" fill="#09090B" stroke="#A855F7" stroke-width="4" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))"/>
    <!-- Screen -->
    <rect x="88" y="36" width="124" height="198" rx="16" fill="#18181B"/>
    <!-- Top Notch -->
    <rect x="125" y="26" width="50" height="8" rx="4" fill="#09090B"/>
    <!-- Social Post inside Phone -->
    <circle cx="106" cy="56" r="10" fill="#EC4899"/>
    <rect x="122" y="52" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <!-- Image Box -->
    <rect x="94" y="74" width="112" height="100" rx="8" fill="linear-gradient(135deg, #EC4899, #8B5CF6)"/>
    <circle cx="150" cy="124" r="22" fill="rgba(255,255,255,0.3)"/>
    <!-- Engagement Bar -->
    <circle cx="106" cy="188" r="5" fill="#EC4899"/>
    <circle cx="120" cy="188" r="5" fill="#CBD5E1"/>
    <circle cx="134" cy="188" r="5" fill="#CBD5E1"/>
  </g>
  <!-- Badge -->
  <g transform="translate(100, 290)">
    <rect width="400" height="75" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="200" y="32" font-family="'Inter', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">SOCIAL MEDIA CREATOR BUNDLE</text>
    <text x="200" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#E9D5FF" text-anchor="middle">100+ Canva &amp; Figma Post &amp; Story Templates</text>
  </g>
</svg>
